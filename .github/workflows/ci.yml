name: CI Pipeline

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install NodeJs
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install packages
        run: npm ci

      - name: Check commit message
        run: |
          if git rev-parse --verify HEAD >/dev/null 2>&1; then
            npx commitlint --from HEAD --to HEAD
          else
            echo "Skipping Commitlint: Not enough commit history."
          fi

      - name: Verify format
        run: npm run format

      - name: Run ESLint
        run: npm run lint

      - name: Compile TypeScript
        run: npm run build

      - name: Run tests
        run: npm run test
