name: CI Pipeline

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install NodeJs
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install packages
        run: npm ci

      - name: Check commit message
        run: |
          COMMIT_MSG=$(git log -1 --pretty=format:"%h - %s" HEAD)
          echo "Validating commit: $COMMIT_MSG"

          npx commitlint --from HEAD --to HEAD

      - name: Verify format
        run: npm run format

      - name: Run ESLint
        run: npm run lint

      - name: Compile TypeScript
        run: npm run build

      - name: Run tests
        run: npm run test
